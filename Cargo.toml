[package]
name = "teamy-embed-resource"
description = "A Cargo library to handle compilation and inclusion of Windows resources in the most resilient fashion imaginable"
repository = "https://github.com/TeamDman/teamy-embed-resource"
readme = "README.md"
keywords = ["cargo", "build", "windows", "resource", "manifest"]
categories = ["development-tools", "os::windows-apis"]
edition = "2021"
rust-version = "1.92"
license = "MIT AND MPL-2.0"
publish = false
# Proposed first fork release. No registry release has been made.
version = "0.1.0"
authors = ["наб <nabijaczleweli@nabijaczleweli.xyz>",
           "Cat Plus Plus <piotrlegnica@piotrl.pl>",
           "Liigo <liigo@qq.com>",
           "azyobuzin <azyobuzin@users.sourceforge.jp>",
           "Peter Atashian <retep998@gmail.com>",
           "pravic <ehysta@gmail.com>",
           "Gabriel Majeri <gabriel.majeri6@gmail.com>",
           "SonnyX",
           "Johan Andersson <repi@repi.se>",
           "Jordan Poles <jpdev.noreply@gmail.com>",
           "MSxDOS <melcodos@gmail.com>",
           "Jim McGrath <jimmc2@gmail.com>",
           "roblabla <unfiltered@roblab.la>",
           "Jasper Bekkers <jasper@traverseresearch.nl>",
           "Richard Markiewicz <rmarkiewicz@devolutions.net>",
           "Emerson de Freitas Barcelos <emersonfxbx@gmail.com>",
           "Li Keqing <me@kaze.ai>",
           "Alexis Bourget <alexis.bourget@gmail.com>",
           "Michael Farrell <micolous+git@gmail.com>",
           "Jacob Okamoto <oko@oko.io>",
           "Marijn Suijten <marijn@traverseresearch.nl>",
           "Lucas Nogueira <lucas@tauri.app>",
           "CharlesChen0823 <yongchen0823@gmail.com>",
           "Daniel Schaefer <dhs@frame.work>",
           "Rene Leonhardt",
           "ssrlive",
           "Kan-Ru Chen <kanru@kanru.info>",
           "Tony <legendmastertony@gmail.com>",
           "Berrysoft <Strawberry_Str@hotmail.com>",
           "Marcus Ahlberg <marcus.ahlberg@kvaser.com>",
           "Thomas Eizinger <thomas@eizinger.io>"]
exclude = ["*.enc"]

[lib]
name = "embed_resource"
path = "src/lib.rs"

[package.metadata.teamy]
upstream_repository = "https://github.com/nabijaczleweli/rust-embed-resource"
upstream_revision = "0d183985c33096a658c3fd8ba19d7eec6cee1dba"


[dependencies]
rustc_version = "0.4"
cc = "1.2"
facet-toml = { package = "teamy-facet-toml", path = "vendor/teamy-facet-toml", version = "=0.50.0-rc.7", optional = true }

[features]
default = ["manifest-discovery"]
# Enables compile(), which checks Cargo.toml for explicit [[bin]] targets.
# compile_for*() remains available without this feature.
manifest-discovery = ["dep:facet-toml"]

[[bin]]
name = "rust-embed-resource"
path = "src/main.rs"
required-features = ["manifest-discovery"]

[target.'cfg(not(target_os = "windows"))'.dependencies]
memchr = "2.7"

[target.'cfg(all(target_os = "windows", not(target_env = "msvc")))'.dependencies]
memchr = "2.7"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
vswhom = "0.1"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies.winreg]
version = "0.56"
default-features = false


[workspace]
members = [".github/workflows/msvc"]
